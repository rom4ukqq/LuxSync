name: Build BrightSync
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: scripts/build-macos.sh
      - name: Test the sender over UDP
        run: scripts/test-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BrightSync-macOS-arm64
          path: dist/BrightSync-macOS-arm64.zip
          if-no-files-found: error
          compression-level: 0
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and test the receiver
        shell: pwsh
        env:
          BRIGHTSYNC_RUN_TESTS: '1'
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BrightSync-Windows-x64
          path: dist/BrightSync-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
